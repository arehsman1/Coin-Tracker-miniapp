server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HashRouter is primary; still allow fallback for static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Never expose source maps in production if present
    location ~* \.map$ {
        return 404;
    }
}
